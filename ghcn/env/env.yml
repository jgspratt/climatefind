---
log:
  datefmt: "%Y-%m-%d %H:%M:%S"
  fmt: "{asctime}.{msecs:03.0f} {process}.{module}.{funcName}:{lineno} [{levelname}] {message}"
  level: "INFO"
  style: '{'

input:
  file_glob: "*.csv"

comfy:
  tmax_solo:
    min: 10
    max: 20
  tmin_if_tmax_above_max: 14

map:
  # Stamen tiles moved to Stadia Maps in 2023 and the free endpoint went dark.
  # OpenTopoMap (CC-BY-SA) is the closest free terrain replacement with no API key.
  name: "OpenTopoMap"
  url: "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png"
  attr: 'Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, SRTM | Map style: &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/">CC-BY-SA</a>)'
  max_zoom: 17
  # Alternate: vanilla street map (no key required).
  # name: "OpenStreetMap"
  # url: "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
  # attr: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  # max_zoom: 19
